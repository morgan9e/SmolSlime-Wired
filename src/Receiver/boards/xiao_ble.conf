CONFIG_USB_DEVICE_MANUFACTURER="Seeed Studio"
CONFIG_USB_DEVICE_PRODUCT="SlimeNRF Receiver XIAO"

CONFIG_LED_RGB_COLOR=y

# The board enables the device_next CDC ACM stack for its console; the receiver uses the
# legacy USB stack (HID + CDC ACM), and both stacks defining the console fails to link.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
