CONFIG_GPIO=y
CONFIG_REBOOT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0x7692
CONFIG_USB_DEVICE_PRODUCT="SlimeNRF IMU Probe"
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_LOG=n
# ProMicro clones have no 32 kHz crystal (same as Tracker/prj.conf)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=n
