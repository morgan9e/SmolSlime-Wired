# MCUboot for the OTA build (make tracker-ota): first stage after the Adafruit UF2 bootloader.
# Built for nrf52840dk/nrf52840 (mcuboot_BOARD in the Makefile): the tracker boards' defconfigs
# set tracker options MCUboot does not have. It only needs the flash controller.
# No console or serial: it only checks and swaps images, and must stay inside its 48 KB.
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_SIZE_OPTIMIZATIONS=y
# As the tracker: no 32 kHz crystal assumed
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
