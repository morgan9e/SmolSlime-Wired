# Flash layout of the MCUboot (OTA) build on the Seeed XIAO nRF52840 (Sense), Adafruit UF2
# bootloader 0.6.1 with SoftDevice S140 7.3.0. Chosen by sysbuild.cmake when
# SB_CONFIG_BOOTLOADER_MCUBOOT is set. The SoftDevice area stays (the bootloader starts the app at
# 0x27000, where MCUboot now is); settings (nvs_storage) and the UF2 bootloader stay where the
# normal build has them, so pairing and calibration survive the switch. The UF2 bootloader writes
# only up to 0xea000 (its CURRENT.UF2 shows the range), so the secondary slot ends there.
# swap-using-move needs the primary slot one page larger than the secondary one.
bootloader:
  address: 0x0
  end_address: 0x27000
  region: flash_primary
  size: 0x27000
mcuboot:
  address: 0x27000
  end_address: 0x33000
  region: flash_primary
  size: 0xc000
mcuboot_pad:
  address: 0x33000
  end_address: 0x33200
  region: flash_primary
  size: 0x200
app:
  address: 0x33200
  end_address: 0x8f000
  region: flash_primary
  size: 0x5be00
mcuboot_primary:
  address: 0x33000
  end_address: 0x8f000
  orig_span: &id001
  - mcuboot_pad
  - app
  region: flash_primary
  size: 0x5c000
  span: *id001
mcuboot_primary_app:
  address: 0x33200
  end_address: 0x8f000
  orig_span: &id002
  - app
  region: flash_primary
  size: 0x5be00
  span: *id002
mcuboot_secondary:
  address: 0x8f000
  end_address: 0xea000
  region: flash_primary
  size: 0x5b000
unused:
  address: 0xea000
  end_address: 0xee000
  region: flash_primary
  size: 0x4000
nvs_storage:
  address: 0xee000
  end_address: 0xf4000
  region: flash_primary
  size: 0x6000
uf2_bootloader:
  address: 0xf4000
  end_address: 0x100000
  region: flash_primary
  size: 0xc000
